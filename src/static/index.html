<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
      <div class="teacher-controls">
        <span id="teacher-status" aria-live="polite">Student view</span>
        <button id="login-button" type="button">Teacher login</button>
        <button id="logout-button" class="hidden" type="button">Log out</button>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <p id="teacher-notice">Teacher login is required to register or remove students.</p>
        <form id="signup-form">
          <fieldset id="signup-fields" disabled>
            <div class="form-group">
              <label for="email">Student Email:</label>
              <input type="email" id="email" required placeholder="student@mergington.edu" />
            </div>
            <div class="form-group">
              <label for="activity">Select Activity:</label>
              <select id="activity" required>
                <option value="">-- Select an activity --</option>
              </select>
            </div>
            <button type="submit">Register student</button>
          </fieldset>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <dialog id="login-dialog" aria-labelledby="login-title">
      <form id="login-form">
        <h3 id="login-title">Teacher login</h3>
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <div id="login-error" class="error hidden" role="alert"></div>
        <div class="dialog-actions">
          <button type="submit">Log in</button>
          <button id="cancel-login" class="secondary-button" type="button">Cancel</button>
        </div>
      </form>
    </dialog>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
